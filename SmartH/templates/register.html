{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block footer %}{% endblock %}
{% block content %}
<div class="auth-wrapper" style="padding:1.5rem;">
  <div class="auth-card" style="max-width:600px;">
    <div class="auth-logo">
      <div class="logo-icon">🏥</div>
      <h2>Create Account</h2>
      <p>Join the SmartHealth platform today</p>
    </div>
    <form method="POST">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">👤 Full Name</label>
          <input type="text" name="name" class="form-control" placeholder="Your full name" required>
        </div>
        <div class="form-group">
          <label class="form-label">📧 Email</label>
          <input type="email" name="email" class="form-control" placeholder="your@email.com" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">🔑 Password</label>
          <input type="password" name="password" class="form-control" placeholder="Create password" required>
        </div>
        <div class="form-group">
          <label class="form-label">📞 Phone</label>
          <input type="text" name="phone" class="form-control" placeholder="+1-555-0100">
        </div>
      </div>
      <div class="form-row-3" style="margin-bottom:0;">
        <div class="form-group">
          <label class="form-label">🎂 Age</label>
          <input type="number" name="age" class="form-control" placeholder="Age">
        </div>
        <div class="form-group">
          <label class="form-label">⚧ Gender</label>
          <select name="gender" class="form-control">
            <option value="">Select</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">🩺 Role</label>
          <select name="role" class="form-control" id="roleSelect" onchange="toggleSpec()">
            <option value="patient">Patient</option>
            <option value="doctor">Doctor</option>
          </select>
        </div>
      </div>
      <div class="form-group" id="specGroup" style="display:none;">
        <label class="form-label">🔬 Specialization</label>
        <select name="specialization" class="form-control">
          <option>General Medicine</option>
          <option>Cardiology</option>
          <option>Neurology</option>
          <option>Orthopedics</option>
          <option>Dermatology</option>
          <option>Pediatrics</option>
          <option>Psychiatry</option>
          <option>Emergency Medicine</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary w-100 btn-lg" style="justify-content:center;margin-top:.5rem;">
        ✅ Create Account
      </button>
    </form>
    <p style="text-align:center;font-size:.88rem;color:var(--gray-600);margin-top:1.25rem;">
      Already have an account? <a href="{{ url_for('login') }}" style="color:var(--pink-500);font-weight:700;">Login here</a>
    </p>
  </div>
</div>
<script>
function toggleSpec(){
  const r = document.getElementById('roleSelect').value;
  document.getElementById('specGroup').style.display = r==='doctor'?'block':'none';
}
</script>
{% endblock %}
